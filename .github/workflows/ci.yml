# SPDX-License-Identifier: Apache-2.0
# The commands of CONTRIBUTING.md § Build and test, in the same image. Not run on pushes to
# master (the Actions budget is monthly and master gets many commits a day): pull requests, tags,
# one nightly run when master changed that day, and by hand (`gh workflow run ci.yml`).
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Release, ASan + UBSan, fuzz regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ThreadSanitizer, the Windows build under Wine, the wheel and wasm configs: on tags and manual runs.
      EXTENDED: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Nightly run only when the last commit is from the last day
        if: github.event_name == 'schedule'
        run: |
          if [ -z "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "No commit since the last nightly run: nothing to test."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Image rayopdf-build:2
        if: env.SKIP != 'true'
        uses: ./.github/actions/build-image
      - name: Release build without compiler warnings
        if: env.SKIP != 'true'
        run: |
          python3 tools/dev.py build --config release 2>&1 | tee build-release.log
          if grep -n 'warning:' build-release.log; then
            echo "::error::the release build has compiler warnings"
            exit 1
          fi
      - name: Tests, release
        if: env.SKIP != 'true'
        run: python3 tools/dev.py test --config release
      - name: Tests, ASan + UBSan
        if: env.SKIP != 'true'
        run: python3 tools/dev.py test --config asan
      - name: Fuzz targets over the committed regressions
        if: env.SKIP != 'true'
        run: python3 tools/fuzz.py replay
      - name: Tests, ThreadSanitizer
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: python3 tools/dev.py test --config tsan
      - name: Tests, Windows build under Wine
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: python3 tools/dev.py test --config windows
      - name: Tests, shared library and Python package (manylinux_2_28)
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: |
          python3 tools/dev.py image --name wheel
          python3 tools/dev.py test --config wheel
      - name: Tests, WebAssembly module and npm package
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: |
          python3 tools/dev.py image --name wasm
          python3 tools/dev.py test --config wasm

  arm64:
    # Linux arm64 natively: the build image built for arm64, the release build, the tests in release
    # (with the two that start the stand-in OCR add-on, which qemu cannot run) and ASan + UBSan, the
    # fuzz regressions, and the manylinux_2_28_aarch64 shared library with the Python package. On
    # tags and manual runs only.
    name: Linux arm64, release, ASan + UBSan, fuzz regressions, wheel
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Image rayopdf-build:2
        uses: ./.github/actions/build-image
      - name: Release build without compiler warnings
        run: |
          python3 tools/dev.py build --config release 2>&1 | tee build-release.log
          if grep -n 'warning:' build-release.log; then
            echo "::error::the release build has compiler warnings"
            exit 1
          fi
      - name: Tests, release
        run: python3 tools/dev.py test --config release
      - name: Tests, ASan + UBSan
        run: python3 tools/dev.py test --config asan
      - name: Fuzz targets over the committed regressions
        run: python3 tools/fuzz.py replay
      - name: Tests, shared library and Python package (manylinux_2_28_aarch64)
        run: |
          python3 tools/dev.py image --name wheel
          python3 tools/dev.py test --config wheel

  macos:
    # macOS on arm64 (macos-15) and x64 (macos-15-intel): no Docker there, so tools/dev.py builds
    # its macos configs with the runner's Xcode 16.4 and the pinned CMake and Ninja. On tags and
    # manual runs only.
    name: macOS ${{ matrix.arch }}, tests, Python package, fuzz regressions through the CLI
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: CMake 3.31.6 and Ninja 1.13.2
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --disable-pip-version-check --quiet cmake==3.31.6 ninja==1.13.2
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Build without compiler warnings
        run: |
          python3 tools/dev.py build --config macos 2>&1 | tee build-macos.log
          if grep -n 'warning:' build-macos.log; then
            echo "::error::the macOS build has compiler warnings"
            exit 1
          fi
      - name: Tests
        run: python3 tools/dev.py test --config macos
      - name: Tests, shared library and Python package
        run: python3 tools/dev.py test --config macos-lib
      - name: The CLI over the fuzz regressions, four page threads
        run: |
          # Any exit code of the converter is an answer; a signal (code 128 or above) is a crash.
          for input in $(find tests/fuzz/regressions -type f | sort); do
            code=0
            build/macos/rayopdf --convert "$input" "$RUNNER_TEMP/out.md" --workers=4 --images=none > /dev/null 2>&1 || code=$?
            echo "$input: exit code $code"
            if [ "$code" -ge 128 ]; then
              echo "::error::$input: rayopdf ended by signal $((code - 128))"
              exit 1
            fi
          done

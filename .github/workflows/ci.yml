# SPDX-License-Identifier: Apache-2.0
# The commands of CONTRIBUTING.md § Build and test, in the same image. Not run on pushes to
# master (the Actions budget is monthly and master gets many commits a day): pull requests, tags,
# one nightly run when master changed that day, and by hand (`gh workflow run ci.yml`).
name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Release, ASan + UBSan, fuzz regressions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # ThreadSanitizer, the Windows build under Wine and the wheel config: on tags and manual runs.
      EXTENDED: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Nightly run only when the last commit is from the last day
        if: github.event_name == 'schedule'
        run: |
          if [ -z "$(git log -1 --since='25 hours ago' --format=%H)" ]; then
            echo "No commit since the last nightly run: nothing to test."
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
      - name: Image rayopdf-build:2
        if: env.SKIP != 'true'
        uses: ./.github/actions/build-image
      - name: Release build without compiler warnings
        if: env.SKIP != 'true'
        run: |
          python3 tools/dev.py build --config release 2>&1 | tee build-release.log
          if grep -n 'warning:' build-release.log; then
            echo "::error::the release build has compiler warnings"
            exit 1
          fi
      - name: Tests, release
        if: env.SKIP != 'true'
        run: python3 tools/dev.py test --config release
      - name: Tests, ASan + UBSan
        if: env.SKIP != 'true'
        run: python3 tools/dev.py test --config asan
      - name: Fuzz targets over the committed regressions
        if: env.SKIP != 'true'
        run: python3 tools/fuzz.py replay
      - name: Tests, ThreadSanitizer
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: python3 tools/dev.py test --config tsan
      - name: Tests, Windows build under Wine
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: python3 tools/dev.py test --config windows
      - name: Tests, shared library and Python package (manylinux_2_28)
        if: env.SKIP != 'true' && env.EXTENDED == 'true'
        run: |
          python3 tools/dev.py image --name wheel
          python3 tools/dev.py test --config wheel
